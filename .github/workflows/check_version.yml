name: Check for New WPS Office Language Pack

on:
  schedule:
    # Запуск каждый понедельник в 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'version.txt'
      - 'revision.txt'
      - 'CHANGELOG.md'
      - 'dist/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  actions: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      # GitHub отключает schedule через 60 дней без активности в репозитории,
      # а коммиты от GITHUB_TOKEN активностью не считаются. Повторное включение
      # через API сбрасывает этот таймер.
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/check_version.yml/enable"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full wget

      # Список модулей Linux-версии WPS берём из пакета wps-office в APT-репозитории
      # и кэшируем по его SHA256, чтобы не качать ~560 МБ на каждом запуске.
      - name: Locate WPS Office package
        id: wps_pkg
        run: |
          set -euo pipefail
          curl -fsSL "${WPS_APT_REPO}/dists/noble/main/binary-amd64/Packages" -o Packages
          awk -v RS= '/(^|\n)Package: wps-office\n/' Packages > wps.stanza
          echo "filename=$(awk '/^Filename:/{print $2}' wps.stanza)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(awk '/^SHA256:/{print $2}' wps.stanza)" >> "$GITHUB_OUTPUT"
          grep -q '^SHA256:' wps.stanza
        env:
          WPS_APT_REPO: https://apt-repo.daydve.workers.dev

      - name: Cache WPS module list
        id: wps_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-modules.txt
          key: wps-modules-${{ steps.wps_pkg.outputs.sha256 }}

      - name: Build WPS module list
        if: steps.wps_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://apt-repo.daydve.workers.dev/${{ steps.wps_pkg.outputs.filename }}" -o "$RUNNER_TEMP/wps-office.deb"
          echo "${{ steps.wps_pkg.outputs.sha256 }}  $RUNNER_TEMP/wps-office.deb" | sha256sum -c -
          python3 .github/scripts/check_version.py --modules-from-deb "$RUNNER_TEMP/wps-office.deb"
          rm -f "$RUNNER_TEMP/wps-office.deb"
        env:
          LINUX_MODULES_FILE: ${{ runner.temp }}/linux-modules.txt

      - name: Run version check and changelog generator
        id: check_step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINUX_MODULES_FILE: ${{ runner.temp }}/linux-modules.txt
        run: |
          python3 .github/scripts/check_version.py 2>&1 | tee build_run.log

      - name: Commit and push changes
        if: steps.check_step.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt revision.txt CHANGELOG.md
          git commit -m "chore: release version ${{ steps.check_step.outputs.version }}"
          git push

      - name: Send Telegram notification on failure
        if: failure() && env.TG_TOKEN != '' && env.TG_CHAT_ID != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Сжимаем лог работы в gzip
          gzip -c build_run.log > run_log.log.gz || true

          MSG="⚠️ *Ошибка в воркфлоу wps-office-langpack-ru*

          *Репозиторий:* \`${GITHUB_REPOSITORY}\`
          *Событие:* \`${GITHUB_EVENT_NAME}\`
          *Ссылка на логи:* https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ -f "run_log.log.gz" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@run_log.log.gz" \
              -F "parse_mode=Markdown" \
              -F "caption=${MSG}"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              -d "text=${MSG}"
          fi
